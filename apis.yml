name: Aiden.ai
description: 'Aiden.ai was a London-based marketing-analytics startup, founded in 2016 by Marie
  Outtier and Pierre-Jean Camillieri, that built what it billed as the first AI-powered marketing
  analyst: a machine-reading assistant that ingested large volumes of paid-advertising data to
  surface actionable insights, detect anomalies, predict campaign performance, and proactively act
  to improve ROI. It raised a $1.6M seed round led by Partech in 2018 and was acquired by Twitter
  (now X) on 2019-11-21. The company no longer operates as an independent business, ships no public
  product or developer API, and the aiden.ai domain is now parked and listed for sale (Afternic).
  This profile is retained as a Partech portfolio lead but is defunct: there is no live developer
  surface to enrich.'
